# Cloudflare Workers 配置
# 使用 @opennextjs/cloudflare 部署 Next.js 应用

name = "u2tool"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 主入口点（由 opennextjs-cloudflare 生成）
main = ".open-next/worker.js"

# 静态资源配置
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# KV 命名空间（用于缓存）
# 需要在 Cloudflare Dashboard 创建后填入 ID
# [[kv_namespaces]]
# binding = "CACHE"
# id = "your-kv-namespace-id"

# R2 存储桶（可选，用于存储翻译文件等大文件）
# [[r2_buckets]]
# binding = "TRANSLATIONS"
# bucket_name = "u2tool-translations"

# 环境变量
[vars]
NEXT_PUBLIC_BASE_URL = "https://www.u2tool.com"

# 生产环境配置
[env.production]
name = "u2tool"
routes = [
  { pattern = "www.u2tool.com", custom_domain = true },
  { pattern = "u2tool.com", custom_domain = true }
]

# 预览环境配置
[env.preview]
name = "u2tool-preview"

# 构建配置
[build]
command = "npm run build:cf"

# 限制配置
[limits]
cpu_ms = 50
