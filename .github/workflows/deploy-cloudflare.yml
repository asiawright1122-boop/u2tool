name: Deploy To Cloudflare

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build And Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_CF_ANALYTICS_TOKEN: ${{ secrets.PUBLIC_CF_ANALYTICS_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)
          test -n "$PUBLIC_CF_ANALYTICS_TOKEN" || (echo "Missing PUBLIC_CF_ANALYTICS_TOKEN secret" && exit 1)

      - name: Install dependencies
        run: npm ci

      - name: Prepare public messages
        run: node scripts/prepare-public-messages.mjs

      - name: Build project
        run: npm run build

      - name: Cleanup public messages
        if: always()
        run: node scripts/cleanup-public-messages.mjs

      - name: Prepare Cloudflare asset manifest
        run: node scripts/deploy/prepare-cloudflare-assets.mjs

      - name: Deploy Worker
        run: npx wrangler deploy

      # A 200 alone is not enough: the dormant Pages project is bound to the same
      # hostnames, so if the Worker routes stop matching, Pages answers instead.
      # Only the Worker can set x-u2tool-html-cache (src/middleware.ts), so its
      # presence — HIT, MISS or BYPASS alike — is what proves the Worker served us.
      - name: Verify Worker serves production
        run: |
          # errexit is on by default in Actions; disable it so a failed curl retries
          # instead of aborting the step.
          set +e
          set -u
          url="https://www.u2tool.com/en/tools/"
          attempts=5
          for attempt in $(seq 1 "$attempts"); do
            headers="$(curl -sS -m 15 -D - -o /dev/null "$url" 2>&1)"
            # Not named `status`: that is a readonly variable in zsh, which breaks
            # copy-pasting this loop into a local shell for debugging.
            http_status="$(printf '%s\n' "$headers" | grep -i '^HTTP/' | tail -n 1 | awk '{print $2}')"
            if [ "$http_status" = "200" ] && printf '%s\n' "$headers" | grep -qi '^x-u2tool-html-cache:'; then
              echo "OK: $url returned 200 and was served by the Worker"
              exit 0
            fi
            echo "Attempt $attempt/$attempts failed (status=${http_status:-no response})"
            if [ "$attempt" -lt "$attempts" ]; then sleep 10; fi
          done
          echo "::error::Worker liveness check failed for $url"
          echo "A 200 without x-u2tool-html-cache means the dormant Pages project is serving production."
          echo "See the 'Dormant Cloudflare Pages project' section in docs/CURRENT_ARCHITECTURE.md"
          exit 1
