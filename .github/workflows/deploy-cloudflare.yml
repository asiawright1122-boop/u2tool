name: Deploy To Cloudflare

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build And Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)

      - name: Install dependencies
        run: npm ci

      - name: Prepare public messages
        run: node scripts/prepare-public-messages.mjs

      - name: Build project
        run: npm run build

      - name: Cleanup public messages
        if: always()
        run: node scripts/cleanup-public-messages.mjs

      - name: Prepare Cloudflare asset manifest
        run: node scripts/deploy/prepare-cloudflare-assets.mjs

      - name: Deploy Worker
        run: npx wrangler deploy
