name: Production Verification

on:
  schedule:
    # 每周一早上 9:00 (UTC) 运行
    - cron: '0 9 * * 1'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read
  issues: write

jobs:
  production-verification:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run production verification
        run: npm run verify:production
      
      - name: Upload production verification artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-verification-report
          path: |
            docs/PROJECT_HEALTH_REPORT.md
            docs/SEO_ALIGNMENT_PRIORITY_REPORT.md
            .planning/TRACEABILITY.md
          retention-days: 30
      
      - name: Comment on issues if problems found
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('docs/PROJECT_HEALTH_REPORT.md', 'utf8');

            const requiredLabels = [
              { name: 'production-verification', color: 'D93F0B', description: 'Automated production verification failures' },
              { name: 'automated', color: '6F42C1', description: 'Created or maintained by automation' }
            ];

            for (const label of requiredLabels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label
                });
              }
            }
            
            // 创建或更新 issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['production-verification']
            });
            
            const body = `## 生产验证失败报告\n\n${report}\n\n---\n*自动生成于 ${new Date().toISOString()}*`;
            
            if (issues.data.length > 0) {
              // 更新现有 issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: body
              });
            } else {
              // 创建新 issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⚠️ 生产验证发现问题',
                body: body,
                labels: ['production-verification', 'automated']
              });
            }
