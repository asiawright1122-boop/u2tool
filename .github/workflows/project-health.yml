name: Project Health Check

on:
  schedule:
    # 每周一早上 9:00 (UTC) 运行
    - cron: '0 9 * * 1'
  workflow_dispatch: # 允许手动触发

jobs:
  health-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run health check
        run: npm run health:check
      
      - name: Upload health report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-report
          path: docs/PROJECT_HEALTH_REPORT.md
          retention-days: 30
      
      - name: Comment on issues if problems found
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('docs/PROJECT_HEALTH_REPORT.md', 'utf8');
            
            // 创建或更新 issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['health-check']
            });
            
            const body = `## 🏥 项目健康检查报告\n\n${report}\n\n---\n*自动生成于 ${new Date().toISOString()}*`;
            
            if (issues.data.length > 0) {
              // 更新现有 issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: body
              });
            } else {
              // 创建新 issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⚠️ 项目健康检查发现问题',
                body: body,
                labels: ['health-check', 'automated']
              });
            }
