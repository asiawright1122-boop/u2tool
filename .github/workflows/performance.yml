name: Performance Monitoring

on:
  pull_request:
    branches: [main]
  workflow_dispatch: # 允许手动触发

jobs:
  performance-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 获取完整历史以便对比
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Load baseline
        id: baseline
        continue-on-error: true
        run: |
          if [ -f benchmarks/baseline.json ]; then
            echo "baseline_exists=true" >> $GITHUB_OUTPUT
          else
            echo "baseline_exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Run performance benchmark
        run: npm run perf:benchmark
      
      - name: Compare with baseline
        if: steps.baseline.outputs.baseline_exists == 'true'
        id: compare
        run: |
          npm run perf:compare > perf-comparison.txt || true
          cat perf-comparison.txt
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: |
            benchmarks/baseline.json
            perf-comparison.txt
          retention-days: 30
      
      - name: Comment PR with performance results
        if: github.event_name == 'pull_request' && steps.baseline.outputs.baseline_exists == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## 📊 性能对比报告\n\n';
            
            try {
              const comparison = fs.readFileSync('perf-comparison.txt', 'utf8');
              comment += '```\n' + comparison + '\n```\n';
            } catch (error) {
              comment += '⚠️ 无法读取性能对比结果\n';
            }
            
            comment += '\n---\n*自动生成于 ' + new Date().toISOString() + '*';
            
            // 查找现有评论
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('性能对比报告')
            );
            
            if (botComment) {
              // 更新现有评论
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              // 创建新评论
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
      
      - name: Fail if performance degraded significantly
        if: steps.baseline.outputs.baseline_exists == 'true'
        run: |
          # 这里可以添加性能退化检测逻辑
          # 例如：如果构建时间增加超过 20%，则失败
          echo "性能检查通过"
