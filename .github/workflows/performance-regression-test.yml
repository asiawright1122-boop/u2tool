name: Performance Regression Test

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - 'scripts/performance-audit/**'
  push:
    branches: [main, master]
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'

jobs:
  regression-test:
    name: Run Performance Regression Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run regression tests
        run: npx tsx scripts/performance-audit/regression-tests.ts
        continue-on-error: false
      
      - name: Run performance verification
        run: npx tsx scripts/performance-audit/verify-performance-improvements.ts
        continue-on-error: true
      
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: |
            PERFORMANCE_REGRESSION_TEST_REPORT.md
            PERFORMANCE_VERIFICATION_REPORT.md
          retention-days: 30
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let comment = '## 🔍 性能回归测试结果\n\n';
            
            try {
              const regressionReport = fs.readFileSync('PERFORMANCE_REGRESSION_TEST_REPORT.md', 'utf8');
              const verificationReport = fs.readFileSync('PERFORMANCE_VERIFICATION_REPORT.md', 'utf8');
              
              // 提取关键指标
              const regressionMatch = regressionReport.match(/有问题的文件 \| (\d+)/);
              const issuesCount = regressionMatch ? parseInt(regressionMatch[1]) : 0;
              
              if (issuesCount === 0) {
                comment += '✅ **所有回归测试通过！**\n\n';
              } else {
                comment += `⚠️ **发现 ${issuesCount} 个文件存在性能问题**\n\n`;
              }
              
              comment += '<details>\n<summary>查看详细报告</summary>\n\n';
              comment += '### 回归测试报告\n\n';
              comment += regressionReport.split('\n').slice(0, 30).join('\n');
              comment += '\n\n### 性能验证报告\n\n';
              comment += verificationReport.split('\n').slice(0, 30).join('\n');
              comment += '\n\n</details>';
              
            } catch (error) {
              comment += '❌ 无法读取测试报告\n\n';
              comment += `错误: ${error.message}`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
