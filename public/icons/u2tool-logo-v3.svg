<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- iOS style rounded square background -->
  <rect width="240" height="240" rx="54" fill="url(#bg-gradient)"/>
  
  <!-- Glossy highlight overlay - top -->
  <path d="M0 54 C0 24 24 0 54 0 L186 0 C216 0 240 24 240 54 L240 100 Q200 120 120 120 Q40 120 0 100 Z" 
        fill="url(#gloss)" opacity="0.1"/>
  
  <!-- U glyph - centered, matching blue tone -->
  <path d="M40 50 L40 145 C40 185 75 215 120 215 C165 215 200 185 200 145 L200 50" 
        stroke="url(#u-gradient)" stroke-width="28" stroke-linecap="round" fill="none"/>
  
  <!-- Geometric T - monochrome blue scheme -->
  <!-- Top bar - trapezoid -->
  <polygon points="75,70 165,70 155,85 85,85" fill="url(#t-top)"/>
  
  <!-- Center triangle pointing down -->
  <polygon points="100,85 140,85 120,165" fill="url(#t-body)"/>
  
  <!-- Inner cut - creates depth -->
  <polygon points="108,95 132,95 120,145" fill="url(#t-inner)"/>
  
  <defs>
    <!-- Dark gradient background -->
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="240" y2="240">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    
    <!-- Top gloss effect -->
    <linearGradient id="gloss" x1="120" y1="0" x2="120" y2="120">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    
    <!-- U gradient - cool blue to silver -->
    <linearGradient id="u-gradient" x1="40" y1="50" x2="200" y2="215">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    
    <!-- T top - bright accent -->
    <linearGradient id="t-top" x1="75" y1="70" x2="165" y2="85">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    
    <!-- T body gradient -->
    <linearGradient id="t-body" x1="120" y1="85" x2="120" y2="165">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    
    <!-- T inner - darker for depth -->
    <linearGradient id="t-inner" x1="120" y1="95" x2="120" y2="145">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>
</svg>