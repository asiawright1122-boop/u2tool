<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- iOS style rounded square background - Light theme -->
  <rect width="240" height="240" rx="54" fill="url(#bg-gradient-light)"/>
  
  <!-- Subtle highlight effect -->
  <path d="M0 54 C0 24 24 0 54 0 L186 0 C216 0 240 24 240 54 L240 100 Q200 120 120 120 Q40 120 0 100 Z" 
        fill="url(#gloss-light)" opacity="0.4"/>
  
  <!-- U glyph - deep cyan for light background -->
  <path d="M40 50 L40 145 C40 185 75 215 120 215 C165 215 200 185 200 145 L200 50" 
        stroke="url(#u-gradient-light)" stroke-width="28" stroke-linecap="round" fill="none"/>
  
  <!-- Geometric T - cyan scheme for light background -->
  <polygon points="75,70 165,70 155,85 85,85" fill="url(#t-top-light)"/>
  <polygon points="100,85 140,85 120,165" fill="url(#t-body-light)"/>
  <polygon points="108,95 132,95 120,145" fill="url(#t-inner-light)"/>
  
  <defs>
    <!-- Light gradient background - soft white to light cyan-gray -->
    <linearGradient id="bg-gradient-light" x1="0" y1="0" x2="240" y2="240">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    
    <linearGradient id="gloss-light" x1="120" y1="0" x2="120" y2="120">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    
    <!-- U gradient - deep teal -->
    <linearGradient id="u-gradient-light" x1="40" y1="50" x2="200" y2="215">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    
    <!-- T top - teal accent -->
    <linearGradient id="t-top-light" x1="75" y1="70" x2="165" y2="85">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    
    <!-- T body gradient -->
    <linearGradient id="t-body-light" x1="120" y1="85" x2="120" y2="165">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    
    <!-- T inner - light for contrast -->
    <linearGradient id="t-inner-light" x1="120" y1="95" x2="120" y2="145">
      <stop offset="0%" stop-color="#99f6e4"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
  </defs>
</svg>
